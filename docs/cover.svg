<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" role="img" aria-label="把产品想法从聊天变成可点击、可标注的线稿蓝图">
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M 22 0 H 0 V 22" fill="none" stroke="#e7e6e0" stroke-width="1"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="13" stdDeviation="13" flood-color="#121310" flood-opacity=".09"/></filter>
  </defs>
  <rect width="1200" height="410" rx="24" fill="#f6f5f1"/>
  <rect width="1200" height="410" rx="24" fill="url(#grid)" opacity=".43"/>
  <path d="M 0 347 H 1200" stroke="#d9d8d2"/>
  <g font-family="Inter,Arial,'PingFang SC','Noto Sans CJK SC',sans-serif" fill="#191a18">
    <text x="58" y="70" font-size="12" font-weight="700" letter-spacing="3">PRODUCT / CONVERSATION / BLUEPRINT</text>
    <text x="58" y="152" font-size="44" font-weight="800">Don't just discuss.</text>
    <text x="58" y="210" font-size="44" font-weight="800">Make it clickable.</text>
    <text x="60" y="262" font-size="18" fill="#5b5d57">Turn product talk into a shared, annotated HTML blueprint.</text>
    <rect x="59" y="296" width="128" height="31" rx="15" fill="#191a18"/>
    <text x="81" y="317" font-size="12" fill="white" font-weight="700">ONE HTML FILE</text>
    <text x="203" y="316" font-size="13" fill="#656761">MOBILE · DESKTOP · JOURNEY · ASSET MAP</text>
  </g>
  <g font-family="Inter,Arial,'PingFang SC','Noto Sans CJK SC',sans-serif">
    <rect x="710" y="76" width="405" height="247" rx="14" fill="white" stroke="#262824" stroke-width="2"/>
    <rect x="710" y="76" width="94" height="247" rx="14" fill="#eeede9" stroke="#262824" stroke-width="2"/>
    <rect x="803" y="76" width="312" height="38" fill="white" stroke="#262824" stroke-width="1.5"/>
    <circle cx="735" cy="96" r="5" fill="#292b27"/><path d="M 727 143 h48 M 727 162 h35 M 727 201 h48" stroke="#9d9e98" stroke-width="5" stroke-linecap="round"/>
    <text x="824" y="101" font-size="12" font-weight="700" fill="#242622">Workspace</text>
    <rect x="825" y="139" width="262" height="112" rx="12" fill="#fafaf8" stroke="#a7aaa3"/>
    <text x="844" y="167" font-size="16" font-weight="700" fill="#232522">The core path comes first.</text>
    <path d="M 844 188 h206 M 844 207 h155" stroke="#d0d1cc" stroke-width="6" stroke-linecap="round"/>
    <circle cx="1072" cy="153" r="13" fill="white" stroke="#191a18" stroke-width="2"/>
    <text x="1068" y="158" font-size="12" font-weight="700" fill="#191a18">1</text>
    <rect x="824" y="269" width="88" height="27" rx="13" fill="#20221e"/>
    <text x="837" y="287" font-size="11" fill="white">Continue →</text>
    <rect x="642" y="122" width="155" height="217" rx="22" fill="white" stroke="#191a18" stroke-width="2.2"/>
    <text x="660" y="155" font-size="13" font-weight="700" fill="#20221e">Today</text>
    <rect x="659" y="169" width="120" height="84" rx="12" fill="#f8f8f5" stroke="#8d9089"/>
    <text x="670" y="192" font-size="11" font-weight="700" fill="#30312e">Primary task</text>
    <path d="M 670 209 h86 M 670 222 h63" stroke="#d2d4cf" stroke-width="5" stroke-linecap="round"/>
    <circle cx="767" cy="180" r="12" fill="white" stroke="#191a18" stroke-width="1.8"/>
    <text x="763" y="185" font-size="11" font-weight="700">1</text>
    <rect x="659" y="265" width="120" height="49" rx="10" fill="#f8f8f5" stroke="#8d9089"/>
    <text x="670" y="286" font-size="10" fill="#555850">Current state</text>
    <circle cx="767" cy="276" r="11" fill="white" stroke="#191a18" stroke-width="1.7"/>
    <text x="764" y="280" font-size="10">2</text>
    <path d="M 659 324 h120" stroke="#191a18" stroke-width="2"/>
  </g>
  <g font-family="Inter,Arial,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="700"><rect x="1020" y="257" width="83" height="26" rx="9" fill="#191a18"/><text x="1030" y="275" fill="white">A01 / art</text></g>
  <text x="58" y="379" fill="#81837d" font-family="Inter,Arial,sans-serif" font-size="11" letter-spacing="1">A SHARED SURFACE FOR PRODUCT THINKING — NOT THE FINAL UI.</text>
</svg>
